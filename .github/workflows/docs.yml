name: Documentation

# Remote automatic CI is temporarily paused by user decision (2026-10-30).
# Keep the full jobs below for manual execution or future CI-machine migration.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs / ${{ matrix.os }} / ${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: matrix.installer == 'uv'
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Check with uv
        if: matrix.installer == 'uv'
        run: uv run --no-project --python 3.11 scripts/check_docs.py
      - name: Create pip environment
        if: matrix.installer == 'pip'
        run: python -m venv .venv-docs
      - name: Check with pip environment (Linux)
        if: matrix.installer == 'pip' && runner.os == 'Linux'
        run: |
          .venv-docs/bin/python -m pip --version
          .venv-docs/bin/python scripts/check_docs.py
      - name: Check with pip environment (Windows)
        if: matrix.installer == 'pip' && runner.os == 'Windows'
        run: |
          .\.venv-docs\Scripts\python.exe -m pip --version
          .\.venv-docs\Scripts\python.exe scripts/check_docs.py
