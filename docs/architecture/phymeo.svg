<text x="790" y="1013" class="sub">网络、训练与模型分发</text>
<text x="790" y="1032" class="sub">tyx.torch：共享存储、流与梯度边界</text>
<text x="1082" y="987" text-anchor="end" class="tag" fill="#94a3b8">B</text>
</g><path class="edge" d="M710 1010H770"/><path class="edge" d="M770 1030H710"/><text x="60" y="1103" class="label">实线框：首期或基础模块方向　虚线框：后续学习功能　A / B：开发责任，不代表部署进程</text>
