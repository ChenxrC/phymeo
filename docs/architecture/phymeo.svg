<text x="920" y="368" class="sub">能力匹配 / 缓冲区预算</text>
<text x="1082" y="342" text-anchor="end" class="tag" fill="#fb923c">A</text>
</g><g data-box="数学 / 刚体与机器人">
<rect x="60" y="500" width="300" height="120" rx="6" fill="#0f172a"/>
<rect x="60" y="500" width="300" height="120" rx="6" fill="#34d399" fill-opacity="0.065" stroke="#34d399" stroke-width="1.5"/>
<text x="80" y="529" class="name">数学 / 刚体与机器人</text>
<text x="80" y="553" class="sub">首批：积分、平面/球体基线</text>
<text x="80" y="572" class="sub">后续：旋转、关节、广义坐标</text>
<text x="80" y="591" class="sub">解析参考与数值误差验收</text>
<text x="342" y="527" text-anchor="end" class="tag" fill="#34d399">A</text>
</g><g data-box="数学 / 布料与柔性体">
<rect x="430" y="500" width="300" height="120" rx="6" fill="#0f172a"/>
<rect x="430" y="500" width="300" height="120" rx="6" fill="#34d399" fill-opacity="0.065" stroke="#34d399" stroke-width="1.5"/>
<text x="450" y="529" class="name">数学 / 布料与柔性体</text>
<text x="450" y="553" class="sub">首批：XPBD 距离、链与布片</text>
<text x="450" y="572" class="sub">后续：弯曲、本构、隐式 FEM</text>
<text x="450" y="591" class="sub">双向耦合端口与材料测试</text>
<text x="712" y="527" text-anchor="end" class="tag" fill="#34d399">B</text>
</g><g data-box="学习模型 / AI 求解">
<rect x="800" y="500" width="300" height="120" rx="6" fill="#0f172a"/>
