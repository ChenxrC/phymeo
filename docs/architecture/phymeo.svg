<text x="820" y="572" class="sub">后续：残差修正、局部代理</text>
<text x="820" y="591" class="sub">训练域声明与数学回退</text>
<text x="1082" y="527" text-anchor="end" class="tag" fill="#a78bfa">B·后续</text>
