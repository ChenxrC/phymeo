<rect x="60" y="960" width="650" height="100" rx="6" fill="#fbbf24" fill-opacity="0.065" stroke="#fbbf24" stroke-width="1.5"/>
<text x="80" y="989" class="name">tyx / 通用计算底座</text>
<text x="80" y="1013" class="sub">公共 kernel、数组、CPU/CUDA、自动微分、稀疏线代、流与图</text>
<text x="80" y="1032" class="sub">phymeo → tyx 单向依赖；GPU 与梯度按真实执行能力验收</text>
<text x="692" y="987" text-anchor="end" class="tag" fill="#fbbf24">A 适配</text>
