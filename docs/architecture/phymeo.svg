<text x="440" y="863" class="sub">配置 / 种子 / 误差 / 两仓 SHA</text>
<text x="722" y="837" text-anchor="end" class="tag" fill="#a78bfa">A + B</text>
</g><g data-box="离线训练与评估">
<rect x="780" y="810" width="320" height="80" rx="6" fill="#0f172a"/>
<rect x="780" y="810" width="320" height="80" rx="6" fill="#a78bfa" fill-opacity="0.065" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="800" y="839" class="name">离线训练与评估</text>
<text x="800" y="863" class="sub">独立数据划分 · 不在线静默更新</text>
<text x="1082" y="837" text-anchor="end" class="tag" fill="#a78bfa">B·后续</text>
</g><text x="60" y="943" class="label">计算依赖边界 / 下方是基础设施，不是额外的物理时间步</text><g data-box="tyx / 通用计算底座">
