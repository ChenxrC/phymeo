<text x="80" y="863" class="sub">唯一写入者 · 不修改输入状态</text>
<text x="362" y="837" text-anchor="end" class="tag" fill="#34d399">A</text>
</g><g data-box="观测与验证轨迹">
<rect x="420" y="810" width="320" height="80" rx="6" fill="#0f172a"/>
<rect x="420" y="810" width="320" height="80" rx="6" fill="#a78bfa" fill-opacity="0.065" stroke="#a78bfa" stroke-width="1.5"/>
