<text x="80" y="213" class="sub">SceneSpec → CompiledScene</text>
<text x="362" y="187" text-anchor="end" class="tag" fill="#22d3ee">A</text>
</g><g data-box="状态与快照">
<rect x="420" y="160" width="320" height="80" rx="6" fill="#0f172a"/>
