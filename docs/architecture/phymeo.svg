<text x="60" y="464" class="label">可组合求解模块 / 同一物理状态与作用量合同</text>
<text x="620" y="276" class="label">编译后的数据、能力与状态快照</text>
<text x="48" y="277" class="tag" fill="#fb7185">拒绝 → 恢复快照 → 数学重算</text>
<text x="620" y="770" class="tag" fill="#34d399">仅接受的候选进入下一步</text>
<g data-box="场景与输入">
<rect x="60" y="35" width="1040" height="70" rx="6" fill="#0f172a"/>
<rect x="60" y="35" width="1040" height="70" rx="6" fill="#22d3ee" fill-opacity="0.065" stroke="#22d3ee" stroke-width="1.5"/>
<text x="80" y="64" class="name">场景与输入</text>
<text x="80" y="88" class="sub">机器人 / 刚体 / 布料 / 柔性体 · 几何、材料、控制与边界条件</text>
<text x="1082" y="62" text-anchor="end" class="tag" fill="#22d3ee">A + B</text>
</g><g data-box="物理模型">
<rect x="60" y="160" width="320" height="80" rx="6" fill="#0f172a"/>
<rect x="60" y="160" width="320" height="80" rx="6" fill="#22d3ee" fill-opacity="0.065" stroke="#22d3ee" stroke-width="1.5"/>
