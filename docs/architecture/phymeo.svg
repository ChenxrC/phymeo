<text x="80" y="733" class="sub">有限性 / 约束误差 / 穿透 / 材料适用域 · 数学回退仍可能失败，必须报告</text>
<text x="1082" y="707" text-anchor="end" class="tag" fill="#fb7185">A + B</text>
</g><g data-box="提交状态">
<rect x="60" y="810" width="320" height="80" rx="6" fill="#0f172a"/>
