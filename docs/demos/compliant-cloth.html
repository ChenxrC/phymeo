<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phymeo · 布料接触回放</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}
body{margin:0;background:#101920;color:#e8f0ee}main{max-width:1200px;margin:0 auto;padding:20px}
header,nav,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}
h1{font-size:25px;margin:0}p{color:#b3c5ca;margin:8px 0}button,select,.file{border:1px solid #48626c;padding:7px 12px;background:#20333b;color:inherit;border-radius:5px;cursor:pointer}
.file input{display:none}#view{height:min(62vh,680px);min-height:300px;background:#15252c;position:relative;margin:14px 0;border:1px solid #31454f;border-radius:7px;overflow:hidden}
canvas{display:block}#err{position:absolute;top:8px;left:12px;color:#ffb093}.controls input[type=range]{flex:1;min-width:180px}
#readout{font:14px/1.65 ui-monospace,monospace;color:#d6e6e3;white-space:pre-line;margin:10px 0}
#source{font-size:12px;overflow-wrap:anywhere}.sw{color:#7edfd7}.key{color:#ffc675}
</style>
<script src="./vendor/three-r160.min.js"></script>
</head><body>
<main><header><div><h1>布料接触回放</h1><p id="case">选择一次 Phymeo 仿真的轨迹</p></div>
<label class="file">打开轨迹 JSON<input type="file" id="file" accept=".json,application/json"></label></header>
<nav><label>跳到阶段 <select id="events"><option>—</option></select></label><label>受力对象 <select id="filter"><option value="">全部</option></select></label>
<label><input type="checkbox" id="forces" checked>接触力</label><select id="component" aria-label="力分量"><option value="total">总力</option><option value="normal">法向力</option><option value="tangent">切向力</option></select><label><input type="checkbox" id="wire" checked>网格边</label></nav>
<div id="view"><span id="err"></span></div>
<div class="controls"><button id="prev" aria-label="上一帧">◀</button><button id="play">播放</button><button id="next" aria-label="下一帧">▶</button>
<input id="time" aria-label="物理帧" type="range" min="0" max="0" value="0" step="1"></div>
<div id="readout">—</div><p>布面与夹爪显示当前物理帧。箭头来自记录的受力采样点，单位为 N。拖动画面旋转，滚轮缩放。</p>
<p id="source"></p></main>
<script id="capture" type="application/json">null</script>
<script>
"use strict";
const el=id=>document.getElementById(id),box=el("view");
let trace=null,index=0,playing=false,clockStart=0,simStart=0;
let renderer,scene,camera,group,cloth,wire,arrows,patches,links,bodies;
let yaw=.52,pitch=.38,distance=1,center=new THREE.Vector3(),extent=1,scale=1,drag=null;
const vec=p=>new THREE.Vector3(p[0],p[1],p[2]);
const colors={table:0x536679,platform:0x7491a2,A:0xe99967,B:0x7999e3};
function material(color,opacity=1){return new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,transparent:opacity<1,opacity,roughness:.75})}
function init(){
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x15252c);
 camera=new THREE.PerspectiveCamera(42,1,.0001,100);camera.up.set(0,0,1);
 scene.add(new THREE.HemisphereLight(0xeaf8ff,0x759092,2.1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(1,-2,3);scene.add(light);
 group=new THREE.Group();scene.add(group);new ResizeObserver(resize).observe(box);
}
function resize(){if(!renderer)return;const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
function render(){if(!renderer)return;camera.position.copy(center).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),-Math.cos(yaw)*Math.cos(pitch),Math.sin(pitch)).multiplyScalar(distance));camera.lookAt(center);renderer.render(scene,camera)}
function deepClear(g){g.traverse(x=>{if(x.geometry)x.geometry.dispose();if(x.material){if(Array.isArray(x.material))x.material.forEach(m=>m.dispose());else x.material.dispose()}});g.clear()}
function mesh(n,indices,color,opacity=1){const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(n*3),3));geo.setIndex(indices);const m=new THREE.Mesh(geo,material(color,opacity));group.add(m);return m}
function coords(mesh,points){const a=mesh.geometry.attributes.position;points.forEach((p,i)=>a.setXYZ(i,p[0],p[1],p[2]));a.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}
function loadTrace(raw,hash=""){
 if(!raw || raw.schema!=="phymeo-compliant-case-v1" || !raw.frames?.length || !raw.faces?.length)throw Error("请选择本示例生成的有效轨迹");
 trace=raw;index=0;playing=false;el("play").textContent="播放";deepClear(group);patches={};
 const first=raw.frames[0];cloth=mesh(first.cloth_position_m.length,raw.faces.flat(),0x63c6bb);
 const edges=raw.faces.flatMap(([a,b,c])=>[a,b,b,c,c,a]);const eg=new THREE.BufferGeometry();eg.setAttribute("position",cloth.geometry.attributes.position);eg.setIndex(edges);
 wire=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x17332f}));group.add(wire);
 for(const [k,v] of Object.entries(first.patch_vertices_m)){const ids=[];for(let i=1;i<v.length-1;i++)ids.push(0,i,i+1);patches[k]=mesh(v.length,ids,colors[k]||colors[k[0]]||0x8899aa,(k==="table"||k==="platform") ? .45 : .78)}
 arrows=new THREE.Group();links=new THREE.Group();bodies=new THREE.Group();group.add(arrows,links,bodies);
 const b=new THREE.Box3();let maxf=.01;
 for(const f of raw.frames){for(const p of f.cloth_position_m)b.expandByPoint(vec(p));for(const row of Object.values(f.contacts||{}))for(const p of row.force_n)maxf=Math.max(maxf,vec(p).length())}
 for(const f of raw.frames)for(const ends of Object.values(f.body_capsules_m||{}))for(const p of ends)b.expandByPoint(vec(p));
 b.getCenter(center);extent=Math.max(.025,b.getSize(new THREE.Vector3()).length());distance=1.8*extent;scale=.30*extent/maxf;
 el("events").replaceChildren(new Option("选择阶段",""));(raw.events||[]).forEach(e=>el("events").add(new Option(e.phase+" · "+e.t.toFixed(3)+" s",e.t)));
 el("filter").replaceChildren(new Option("全部",""));Object.keys(patches).forEach(k=>el("filter").add(new Option(k,k)));(raw.robot_contact?.capsules||[]).forEach(c=>el("filter").add(new Option(c.key,c.key)));
 el("time").max=raw.frames.length-1;el("case").textContent=raw.case+" · "+(raw.completed?"完成":("停止 "+(raw.failure_phase||"")+" "+(raw.failure||"")))+" · "+raw.backend;
 el("source").textContent=(hash?"源 JSON SHA-256 "+hash+" · ":"")+"位置 m，渲染缓冲 FP32，记录保留原精度。";el("err").textContent="";show(0);
}
function show(n){
 if(!trace)return;index=Math.max(0,Math.min(trace.frames.length-1,Math.round(n)));el("time").value=index;
 const f=trace.frames[index];const latest=(trace.events||[]).filter(e=>e.t<=f.t+1e-12).at(-1);el("events").value=latest?String(latest.t):"";coords(cloth,f.cloth_position_m);wire.visible=el("wire").checked;
 for(const [k,v] of Object.entries(f.patch_vertices_m))coords(patches[k],v);
 deepClear(arrows);deepClear(links);deepClear(bodies);
 for(const [name,robot] of Object.entries(f.robots)){if(!robot.links_m||!trace.robot_parents?.[name])continue;
   robot.links_m.forEach((p,i)=>{const parent=trace.robot_parents[name][i];if(parent<0)return;const g=new THREE.BufferGeometry().setFromPoints([vec(robot.links_m[parent]),vec(p)]);links.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:colors[name]||0xffffff})))})}
 for(const shape of trace.robot_contact?.capsules||[]){
   const ends=f.body_capsules_m?.[shape.key];if(!ends)continue;
   const a=vec(ends[0]),b=vec(ends[1]),delta=b.clone().sub(a),length=delta.length();
   const geom=length>0?new THREE.CapsuleGeometry(shape.radius_m,length,4,10):new THREE.SphereGeometry(shape.radius_m,12,8);
   const body=new THREE.Mesh(geom,material(colors[shape.domain]||0x8899aa,.62));
   body.position.copy(a).add(b).multiplyScalar(.5);
   if(length>0)body.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.divideScalar(length));
   bodies.add(body);
 }
 let sums=[];
 for(const [k,r] of Object.entries(f.contacts||{})){if(el("filter").value&&el("filter").value!==k)continue;
   sums.push(k+" "+r.normal_force_n.reduce((a,b)=>a+b,0).toFixed(3)+" N");
   if(el("forces").checked)r.force_n.forEach((p,i)=>{const v=vec(p),kind=el("component").value;
     if(kind!=="total"){if(!r.normal)return;const nv=vec(r.normal).multiplyScalar(r.normal_force_n[i]);if(kind==="normal")v.copy(nv);else v.sub(nv)}
     const m=v.length();if(m>1e-9){const len=m*scale;const a=new THREE.ArrowHelper(v.normalize(),vec(r.points_m[i]),len,0xffc675,Math.min(len*.25,.035*extent),Math.min(len*.12,.017*extent));arrows.add(a)}})}
 for(const row of f.robot_contact?.contacts||[]){
   if(el("filter").value && ![row.a,row.b].includes(el("filter").value))continue;
   sums.push(row.a+" ↔ "+row.b+" "+row.normal_force_n.toFixed(3)+" N");
   if(el("forces").checked){
     const onB=el("filter").value===row.b;
     const v=vec(onB?row.force_on_b_n:row.force_on_a_n),kind=el("component").value;
     if(kind!=="total"){const nv=vec(row.normal).multiplyScalar((onB?-1:1)*row.normal_force_n);if(kind==="normal")v.copy(nv);else v.sub(nv)}
     const m=v.length();if(m>1e-9)arrows.add(new THREE.ArrowHelper(v.normalize(),vec(row.point_m),m*scale,0xf38064));
   }
 }
 if(f.robot_contact)sums.push("关节越界 "+f.robot_contact.joint_violation.toExponential(2)+" rad/m");
 el("readout").textContent="帧 "+index+"/"+(trace.frames.length-1)+"   t="+f.t.toFixed(5)+" s   "+(f.phase||trace.case)+"\n力采样 t="+(f.force_sample_s??f.t).toFixed(5)+" s   "+sums.join("   ")+"\n箭头比例 "+scale.toPrecision(3)+" m/N";render();
}
function pause(){playing=false;el("play").textContent="播放"}
function tick(now){if(playing&&trace){const t=simStart+(now-clockStart)/1000;let next=index;while(next+1<trace.frames.length && trace.frames[next+1].t<=t)next++;if(next!==index)show(next);if(index===trace.frames.length-1)pause()}requestAnimationFrame(tick)}
el("play").onclick=()=>{if(!trace)return;if(playing){pause();return}if(index===trace.frames.length-1)show(0);playing=true;clockStart=performance.now();simStart=trace.frames[index].t;el("play").textContent="暂停"};
el("prev").onclick=()=>{pause();show(index-1)};el("next").onclick=()=>{pause();show(index+1)};
el("time").oninput=e=>{pause();show(Number(e.target.value))};el("events").onchange=e=>{if(e.target.value==="")return;pause();const ix=trace.frames.findIndex(f=>f.t>=Number(e.target.value)-1e-12);show(ix<0?trace.frames.length-1:ix)};
el("forces").onchange=el("wire").onchange=el("filter").onchange=el("component").onchange=()=>show(index);
el("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const bytes=await f.arrayBuffer();const hash=crypto.subtle?Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),x=>x.toString(16).padStart(2,"0")).join(""):"";loadTrace(JSON.parse(new TextDecoder().decode(bytes)),hash)}catch(err){el("err").textContent=err.message}};
box.onpointerdown=e=>{drag=[e.clientX,e.clientY];box.setPointerCapture(e.pointerId)};box.onpointerup=()=>drag=null;
box.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pitch=Math.min(1.5,Math.max(-1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];render()};
box.onwheel=e=>{e.preventDefault();distance=Math.max(.1*extent,Math.min(10*extent,distance*Math.exp(e.deltaY*.001)));render()};
try{init();const cap=JSON.parse(el("capture").textContent);if(cap)loadTrace(cap.trajectory,cap.source_sha256);resize();requestAnimationFrame(tick)}catch(e){el("err").textContent=e.message}
</script></body></html>
