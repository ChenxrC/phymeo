[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "phymeo"
version = "0.1.0a0"
description = "Experimental physics engine with explicit mathematical and learned solver contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
usd = ["usd-core==26.8"]
training = ["torch>=2.6,<3", "tensordict>=0.7,<1", "rsl-rl-lib==5.5.2"]

[project.urls]
Repository = "https://github.com/ChenxrC/phymeo"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "build>=1.2,<2",
    "setuptools>=77,<83",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "tyx: requires the separately installed pinned tyx runtime",
    "cuda: requires actual CUDA hardware execution",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"phymeo.builders" = ["panda_assets/*.urdf", "panda_assets/LICENSE", "panda_assets/NOTICE", "panda_assets/SOURCES.md"]
