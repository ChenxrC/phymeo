[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "phymeo-rendering"
version = "0.1.0a0"
description = "Calibrated offscreen rendering for Phymeo scenes"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
sapien = ["sapien==3.0.3", "numpy==1.26.4"]
textures = ["Pillow==12.2.0"]
prepare = ["Pillow==12.2.0", "vtk>=9.3,<10", "numpy>=1.26,<3"]
ibl = ["numpy==1.26.4"]

[tool.setuptools]
# Map the pinned data directories directly into the wheel.
packages = ["phymeo_rendering", "phymeo_rendering.adapters", "phymeo_rendering.backends", "phymeo_rendering._panda_assets", "phymeo_rendering._studio_assets"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"phymeo_rendering._panda_assets" = "assets/panda"
"phymeo_rendering._studio_assets" = "examples/materials"

[tool.setuptools.package-data]
"phymeo_rendering.backends" = [
    "_native/CMakeLists.txt", "_native/*.cmake", "_native/*.cpp",
    "_native/*.h", "_native/*.hpp", "_native/*.inc", "_shaders/*",
]
"phymeo_rendering._panda_assets" = ["*", "meshes/*.gltf", "original/*"]
"phymeo_rendering._studio_assets" = ["university_workshop_1k.hdr", "NOTICE.md"]

[tool.setuptools.exclude-package-data]
# This wheel carries platform-independent build INPUTS, never a local build.
"*" = ["*.dll", "*.pyd", "*.so", "*.dylib", "*.spv", "*.exe", "*.lib", "*.a", "*.o", "*.obj"]
